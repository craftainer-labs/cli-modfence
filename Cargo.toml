# Cargo workspace with one example library crate. The root package is the
# crate; an instance that grows into several crates adds them under
# crates/ and to `members`. See docs/TEMPLATE.md.
[workspace]
resolver = "3"
members = ["."]

[workspace.package]
version = "0.0.0"
edition = "2024"
# Matches rust-toolchain.toml (major.minor is enough for MSRV semantics).
rust-version = "1.99"
license = "GPL-3.0-only"
repository = "https://github.com/craftainer-labs/cli-modfence"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[package]
# The template carries its own name; an instance renames it (see README.md).
name = "modfence"
description = "Cross-language module-boundary checker for Python, TypeScript and Rust"
readme = "README.md"
# At most five keywords; the categories are slugs from
# https://crates.io/category_slugs. The release binaries, wheels and npm
# packages reuse the keywords (scripts/binaries/).
keywords = ["architecture", "lint", "static-analysis", "sarif", "dependencies"]
categories = ["development-tools", "command-line-utilities"]
# Stays 0.0.0 in git: the release tag is the real version. `publish` is left
# at Cargo's default (true) and gated by the release contract's
# CARGO_PUBLISH switch, not here.
# Only what a dependent needs goes into the .crate (the default would ship
# .devcontainer/, docs/, scripts/ and more).
include = ["/src/", "/tests/", "/README.md", "/LICENSE"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Parsing for the Python, TypeScript and Rust extractors (ADR 0003). The core
# loads grammars of ABI 13 to 15 (>= 0.25); every grammar crate needs only
# tree-sitter-language ^0.1, which the core also uses. JavaScript is parsed
# with the TypeScript grammar, which provides TypeScript and TSX.
tree-sitter = "0.27.1"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"

# Config, graph and report code (NC4, ADRs 0003 and 0004). `toml` parses
# modfence.toml with key spans for file-and-line errors, `serde` derives its
# model (deny_unknown_fields makes unknown keys errors), `serde_json` writes
# the graph JSON and SARIF, and `globset` matches path globs. No graph crate:
# rules, tags, collapse-to-depth and `trace` need no graph algorithms.
globset = "0.4.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

# Argument parsing for the CLI (NC4c). Minimal features: derive for the
# argument structs, plus help, usage and error messages. No color, env,
# suggestions or other extras, and no network-capable crates (NFR-0002).
clap = { version = "4.6.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }

# SCIP index reader for `--precise` (NC6, ADR 0003). `scip` ships the
# generated protobuf types, needs no protoc at build time and does no I/O;
# it pins `protobuf` to =3.7.2. The direct `protobuf` entry brings the
# `Message` trait into scope for parsing; Cargo resolves it to the pinned
# 3.7.2. No network-capable crates (NFR-0002).
protobuf = "=3.7.2"
scip = "0.10.0"

[lints]
workspace = true

# The profile the release binaries and wheels build with (dist and maturin both
# select it, see docs/TEMPLATE.md): smaller, stripped binaries. Nothing changes
# for `cargo build` / `cargo test`.
[profile.dist]
inherits = "release"
lto = "thin"
strip = true
