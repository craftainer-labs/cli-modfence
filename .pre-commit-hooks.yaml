# Hooks other repositories can use through pre-commit or prek:
#
#   repos:
#     - repo: https://github.com/craftainer-labs/cli-modfence
#       rev: vX.Y.Z
#       hooks:
#         - id: modfence
#
# `language: rust` builds the tagged source with `cargo install` into the
# hook's private environment (pre-commit and prek both install a Rust
# toolchain on demand), so a hook needs no release binary and pins to a git
# tag. Building needs crates.io once, at install; the checker itself opens no
# network connection (NFR-0002). A faster install without a compiler is a
# mirror repository that installs the PyPI wheel (`language: python`,
# `additional_dependencies`).
#
# The hook checks the whole repository, not the staged files: a module
# boundary is violated by an import in one file of another, so a partial view
# would miss findings. It finds `modfence.toml` by walking up from the
# working directory and exits 1 when a finding is at or above `--fail-on`
# (default `error`), 2 for a usage or configuration error. A repository
# passes extra flags with `args`, for example `[--fail-on, warning]`. The
# tests in tests/hook.rs keep this file valid and its `entry` a real command.
- id: modfence
  name: modfence
  description: Check module boundaries (modfence.toml) across Python, TypeScript and Rust
  entry: modfence check
  language: rust
  pass_filenames: false
  always_run: true
